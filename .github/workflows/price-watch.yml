name: ShrimpWatch price check

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/check-price.mjs'
      - 'data/price-state.json'
      - '.github/workflows/price-watch.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shrimpwatch-price-check
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Show trigger and runner time
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Commit: ${{ github.sha }}"

      - name: Check price and send alert if needed
        run: npm run watch:price
        env:
          SILPO_FILIAL_ID: ${{ secrets.SILPO_FILIAL_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

      - name: Report failed price check
        if: failure()
        run: echo "Price check failed. Inspect the previous step logs; stored price remains unchanged."

      - name: Save latest price state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update shrimp price state"
            git push
          else
            echo "Price state unchanged."
          fi
